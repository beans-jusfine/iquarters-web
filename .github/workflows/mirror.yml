name: Copy iQuarters source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: beans-jusfine/iQuarters
          ref: main
          path: source
          persist-credentials: false
      - name: Copy source files except CNAME
        run: |
          rsync -a --exclude='.git' --exclude='CNAME' --exclude='.github/workflows/' source/ ./
          rm -rf source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to copy"
          else
            git commit -m "Copy iQuarters source files (excluding CNAME)"
            git push
          fi
